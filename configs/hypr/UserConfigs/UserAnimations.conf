# name "Dynamic"
# credit https://github.com/mylinuxforwork/dotfiles 

animations {
    enabled = true
    
    # iPhone-style smooth beziers
    bezier = fluent, 0.4, 0, 0.2, 1
    bezier = fluid, 0.1, 0.9, 0.1, 1.05
    bezier = quick, 0.1, 1, 0.1, 1.02
    
    animation = windows, 1, 4, quick, slide
    animation = windowsIn, 1, 4, fluid, slide
    animation = windowsOut, 1, 4, fluent, slide
    animation = windowsMove, 1, 4, quick, slide
    animation = border, 1, 5, default
    animation = borderangle, 1, 20, default, loop
    animation = fade, 1, 5, fluent
    animation = workspaces, 1, 5, fluid, slide
}
